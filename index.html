<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study">
<title>Study</title>
<style>
  :root { --ink:#1b1f24; --muted:#5b6470; --accent:#1f3a5f; --on-accent:#ffffff; --bg:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8eaed; --muted:#a0a8b3; --accent:#8fb4e3; --on-accent:#14171b; --bg:#14171b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); line-height:1.5;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:34rem; margin:0 auto; padding:2.5rem 1.25rem 3rem; }
  h1 { font-size:1.75rem; line-height:1.2; margin:0 0 .25rem; }
  .status { color:var(--muted); margin:0 0 1.5rem; }
  .open { display:block; text-align:center; padding:1.1rem 1rem; border-radius:.75rem;
          background:var(--accent); color:var(--on-accent); font-weight:600; font-size:1.125rem; text-decoration:none; }
  a:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <h1 id="today">Study</h1>
  <p class="status">A new PDF is ready here every morning.</p>
  <a id="open" class="open" target="_blank" rel="noopener">Open today's PDF</a>
</main>
<script>
  const LINK = 'https://drive.google.com/drive/folders/1a-2dhwfPQ7gTWJ0pkccQ1p0h8Lze8TAH';

  const open = document.getElementById('open');
  open.href = LINK;
  open.textContent = LINK.includes('/folders/') ? 'Open the study folder' : "Open today's PDF";

  document.getElementById('today').textContent =
    new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
</script>
</body>
</html>
